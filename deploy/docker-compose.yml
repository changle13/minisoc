name: minisoc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minisoc
      POSTGRES_PASSWORD: minisoc_dev_password
      POSTGRES_DB: minisoc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisoc -d minisoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://minisoc:minisoc_dev_password@postgres:5432/minisoc
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-ingest-key
      JWT_SECRET: dev-jwt-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin_dev_password
      RESPONSE_ENABLED: "true"
      RESPONSE_AGENT_URL: http://192.168.65.20:9000
      RESPONSE_AGENT_SECRET: dev-response-secret
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
